name: Profile stats

on:
  schedule:
    - cron: "0 */12 * * *"   # every 12 hours
  workflow_dispatch:          # lets you run it manually from the Actions tab
  push:
    branches: [main]
    paths:
      - ".github/workflows/profile-stats.yml"
      - ".github/scripts/matchday.py"

permissions:
  contents: write

jobs:
  matchday:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render match day card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/matchday.py "${{ github.repository_owner }}" assets/matchday.svg
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/matchday.svg
          git diff --cached --quiet || (git commit -m "Update match day stats" && git push)

  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#0b3316&color_dots=#e3f2e5,#a5d6a7,#66bb6a,#2e8b3e,#1c6b2c
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#C6F432&color_dots=#10261a,#1c6b2c,#2e8b3e,#4caf50,#8bc34a
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
